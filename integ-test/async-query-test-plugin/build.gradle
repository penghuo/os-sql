// Test-only OpenSearch plugin installed in the async PPL integration-test clusters. It holds and
// observes the searches of one async query so cancellation can be asserted deterministically.
plugins {
    id 'java'
    id 'opensearch.opensearchplugin'
}

opensearchplugin {
    name 'async-query-test-plugin'
    description 'Test fixture that holds and observes searches of async PPL queries'
    classname 'org.opensearch.sql.asyncfixture.AsyncQueryTestPlugin'
    licenseFile rootProject.file('LICENSE.txt')
    noticeFile rootProject.file('NOTICE')
}

javadoc.enabled = false
loggerUsageCheck.enabled = false
dependencyLicenses.enabled = false
thirdPartyAudit.enabled = false
testingConventions.enabled = false
forbiddenApisMain.enabled = false
validateNebulaPom.enabled = false
